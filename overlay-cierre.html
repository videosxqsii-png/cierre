<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cierre carpincho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: #0d0a24; }
  #world > * { position: absolute; }
  svg { display: block; }
  .rgb { animation: hue 9s linear infinite; }
  @keyframes hue { to { filter: hue-rotate(360deg); } }
  .twinkle { animation: tw 2.8s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

  .z { font-family: 'Bungee', Impact, sans-serif; fill: #bfe9ff; opacity: 0; paint-order: stroke; stroke: #2a4a8a; stroke-width: 4px; }
  .z.on { animation: zfloat 3.6s ease-out infinite; }
  @keyframes zfloat {
    0% { opacity: 0; transform: translate(0,0) scale(.6); }
    15% { opacity: 1; }
    100% { opacity: 0; transform: translate(70px,-150px) scale(1.25); }
  }

  /* Título neón */
  #titleWrap { left: 100px; top: 70px; width: 1250px; height: 180px; z-index: 50; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  #title {
    opacity: 0; font-family: 'Bungee', Impact, sans-serif; font-size: 120px; line-height: 1; text-transform: uppercase; white-space: nowrap; color: #fff;
    text-shadow: 0 0 6px #fff, 0 0 16px #ff2bd6, 0 0 34px #ff2bd6, 0 0 64px #ff2bd6, 0 6px 22px rgba(0,0,0,.8);
  }

  /* Reloj */
  #clock { left: 1440px; top: 345px; width: 400px; height: 400px; z-index: 40; }
  #case { position: absolute; inset: 0; border-radius: 40px; background: linear-gradient(160deg, #ffd21f 0%, #f2b400 100%);
    box-shadow: 16px 16px 0 #b98400, 0 30px 40px rgba(0,0,0,.5), inset 0 0 0 3px rgba(255,255,255,.25); }
  #dial { position: absolute; left: 28px; top: 28px; width: 344px; height: 344px; border-radius: 16px; overflow: hidden; background: #000;
    box-shadow: inset 0 0 0 4px #1a1300, 0 0 0 4px #8f6700; }
  #videoBox { position: absolute; inset: 0; opacity: 0; }
  #videoBox #yt, #videoBox iframe { position: absolute; left: -134px; top: 0; width: 612px; height: 344px; border: 0; }
  #demoVid { position: absolute; inset: 0; display: none; background: linear-gradient(135deg, #ff2bd6, #00e5ff, #ffe600); }
  #tint { position: absolute; inset: 0; background: radial-gradient(closest-side, rgba(0,0,0,.05), rgba(0,0,0,.42)); pointer-events: none; }
  #face { position: absolute; inset: 0; width: 344px; height: 344px; }
  #glassShine { position: absolute; inset: 0; background: linear-gradient(120deg, rgba(255,255,255,.18) 0%, rgba(255,255,255,0) 42%); pointer-events: none; }
  #dbg { position: absolute; left: 6px; bottom: 6px; right: 6px; color: #fff; font: 12px 'Rubik', Arial, sans-serif; background: rgba(0,0,0,.7); padding: 4px 6px; border-radius: 4px; display: none; }
  .z { filter: drop-shadow(0 0 8px rgba(140,200,255,.85)); transform-box: fill-box; transform-origin: 50% 50%; }
  .mote { animation: mote 9s ease-in-out infinite; }
  @keyframes mote { 0%,100% { transform: translate(0,0); opacity: 0; } 20% { opacity: .9; } 50% { transform: translate(18px,-26px); opacity: .5; } 80% { opacity: .9; } }
  .cloud { animation: cloud 46s linear infinite; }
  @keyframes cloud { from { transform: translateX(-140px); } to { transform: translateX(340px); } }
</style>
</head>

<div id="stage">
 <div id="world">

  <!-- Habitación -->
  <svg id="room" style="left:0;top:0" width="1920" height="1080" viewBox="0 0 1920 1080">
    <defs>
      <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d1447"/><stop offset="1" stop-color="#0d0a24"/></linearGradient>
      <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#241a52"/><stop offset="1" stop-color="#0c0820"/></linearGradient>
      <linearGradient id="rgbg" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#ff2bd6"/><stop offset=".33" stop-color="#7a5cff"/><stop offset=".66" stop-color="#00e5ff"/><stop offset="1" stop-color="#38ff6b"/>
      </linearGradient>
      <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#fff" stroke-opacity=".035" stroke-width="2"/></pattern>

      <rect x="0" y="0" width="1920" height="6" fill="url(#rgbg)"/>

    <rect x="1425" y="878" width="410" height="62" rx="8" fill="#241a52" stroke="#3b2d78" stroke-width="3"/>
    <circle cx="1630" cy="831" r="9" fill="#a98dff"/><circle cx="1630" cy="909" r="9" fill="#a98dff"/>
    <ellipse cx="1630" cy="968" rx="260" ry="14" fill="#000" opacity=".35"/>

    <!-- cama de frente (parte de atrás) -->
    <ellipse cx="790" cy="968" rx="560" ry="26" fill="#000" opacity=".4"/>
    <rect x="352" y="900" width="40" height="64" rx="8" fill="#2b1d5c"/>
    <rect x="1188" y="900" width="40" height="64" rx="8" fill="#2b1d5c"/>
    <rect x="340" y="400" width="900" height="500" rx="70" fill="#2e2066" stroke="#4a3a99" stroke-width="5"/>
    <rect x="372" y="436" width="836" height="420" rx="48" fill="#271a5a" stroke="#3b2d78" stroke-width="3"/>
    <g fill="none" stroke="#3b2d78" stroke-width="3"><path d="M600 440 V850 M790 440 V850 M980 440 V850"/></g>
    <rect x="380" y="640" width="820" height="12" rx="6" fill="#3a2b7a" opacity=".0"/>
    <!-- almohadas -->
    <path d="M420 760 C405 660 470 625 560 625 C650 625 700 660 690 760 Z" fill="#f4eeff" stroke="#9d86e6" stroke-width="4"/>
    <path d="M890 760 C880 660 930 625 1020 625 C1110 625 1175 660 1160 760 Z" fill="#f4eeff" stroke="#9d86e6" stroke-width="4"/>
    <path d="M450 700 Q560 678 665 700 M915 700 Q1020 678 1135 700" fill="none" stroke="#cdbdf5" stroke-width="3"/>
  </svg>

      <radialGradient id="bubG" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffffff" stop-opacity=".75"/><stop offset=".55" stop-color="#bfe3ff" stop-opacity=".28"/><stop offset="1" stop-color="#8fc8ff" stop-opacity=".18"/></radialGradient>
    </defs>
    <!-- rayo de luna desde la ventana -->
    <g id="shaft" style="opacity:0;mix-blend-mode:screen"><g filter="url(#soft)">
      <polygon points="300,350 336,560 980,930 560,930" fill="url(#shaftG)"/></g>
      <g fill="#dfe8ff"><circle class="mote" cx="470" cy="640" r="3"/><circle class="mote" style="animation-delay:-2s" cx="560" cy="720" r="2.5"/><circle class="mote" style="animation-delay:-4s" cx="640" cy="800" r="3"/><circle class="mote" style="animation-delay:-1s" cx="420" cy="560" r="2"/><circle class="mote" style="animation-delay:-3s" cx="700" cy="860" r="2.5"/></g>
    </g>
    <!-- globito de moco: se infla y se desinfla al respirar -->
    <g id="bubble" style="transform-origin: 652px 600px; transform: scale(0); opacity:0">
      <circle cx="624" cy="598" r="28" fill="url(#bubG)" stroke="#d8efff" stroke-width="2" stroke-opacity=".7"/>
      <ellipse cx="614" cy="588" rx="8" ry="5" fill="#fff" opacity=".7" transform="rotate(-30 614 588)"/>
    </g>
    <g id="zs">
      <text class="z" id="z1" x="930" y="410" font-size="44">Z</text>
      <text class="z" id="z2" x="930" y="410" font-size="58">z</text>
      <text class="z" id="z3" x="930" y="410" font-size="76">Z</text>
      <text class="z" id="z4" x="930" y="410" font-size="50">z</text>
      <text class="z" id="z5" x="930" y="410" font-size="68">Z</text>
    </g>
  </svg>

  <!-- Ventana con luna -->
  <svg id="win" style="left:30px;top:330px;z-index:30" width="300" height="244" viewBox="0 0 320 260">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1546"/><stop offset="1" stop-color="#2d3a8f"/></linearGradient>
      <filter id="moonGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="9"/></filter>
    </defs>
    <rect x="6" y="6" width="308" height="248" rx="16" fill="#2e2066" stroke="#4a3a99" stroke-width="5"/>
    <rect x="22" y="22" width="276" height="216" rx="8" fill="url(#sky)"/>
    <circle cx="220" cy="96" r="44" fill="#fff6c8" opacity=".55" filter="url(#moonGlow)"/>
    <circle cx="220" cy="96" r="30" fill="#fff6c8"/>
    <circle cx="232" cy="88" r="26" fill="#1a2470"/>
    <g fill="#fff"><circle class="twinkle" cx="70" cy="64" r="3"/><circle class="twinkle" style="animation-delay:.9s" cx="120" cy="120" r="2.5"/><circle class="twinkle" style="animation-delay:1.7s" cx="64" cy="168" r="3"/><circle class="twinkle" style="animation-delay:.4s" cx="150" cy="52" r="2"/><circle class="twinkle" style="animation-delay:2.1s" cx="270" cy="190" r="2.5"/></g>
    <clipPath id="skyClip"><rect x="22" y="22" width="276" height="216" rx="8"/></clipPath>
    <g clip-path="url(#skyClip)"><g class="cloud" fill="#cfd8ff" opacity=".28"><ellipse cx="60" cy="170" rx="46" ry="12"/><ellipse cx="92" cy="160" rx="30" ry="13"/><ellipse cx="30" cy="164" rx="22" ry="9"/></g></g>
    <path d="M160 22 V238 M22 130 H298" stroke="#2e2066" stroke-width="8"/>
  </svg>

  <!-- Brillo detrás del reloj -->
  <div id="clockGlow" style="left:1440px;top:345px;width:400px;height:400px;z-index:35;border-radius:60px;background:rgba(255,200,40,.55);filter:blur(60px);opacity:0;pointer-events:none"></div>

  <!-- Reloj despertador -->
  <div id="clock">
    <!-- campanas -->
    <div style="position:absolute;left:70px;top:-34px;width:84px;height:46px;border-radius:44px 44px 6px 6px;background:#ffd21f;box-shadow:6px 6px 0 #b98400;transform:rotate(-14deg)"></div>
    <div style="position:absolute;left:246px;top:-34px;width:84px;height:46px;border-radius:44px 44px 6px 6px;background:#ffd21f;box-shadow:6px 6px 0 #b98400;transform:rotate(14deg)"></div>
    <div id="case"></div>
    <div id="dial">
      <div id="videoBox"><div id="yt"></div><div id="demoVid"></div><div id="dbg"></div></div>
      <div id="tint"></div>
      <svg id="face" viewBox="0 0 344 344">
        <g id="ticks" stroke="#f6f1d9" stroke-width="5" stroke-linecap="round"></g>
        <g font-family="Rubik, Arial, sans-serif" font-weight="700" font-size="54" fill="#f6f1d9" stroke="#0c0c0c" stroke-width="5" paint-order="stroke" text-anchor="middle">
          <text x="172" y="72">12</text><text x="288" y="190">3</text><text x="172" y="310">6</text><text x="56" y="190">9</text>
        </g>
        <g id="hHand" style="filter:drop-shadow(0 2px 3px rgba(0,0,0,.7))"><rect x="165" y="92" width="14" height="96" rx="6" fill="#f6f1d9" stroke="#111" stroke-width="2.5"/></g>
        <g id="mHand" style="filter:drop-shadow(0 2px 3px rgba(0,0,0,.7))"><rect x="167" y="52" width="10" height="136" rx="5" fill="#f6f1d9" stroke="#111" stroke-width="2.5"/></g>
        <g id="sHand" style="filter:drop-shadow(0 2px 3px rgba(0,0,0,.7))"><rect x="170.5" y="38" width="3" height="170" fill="#ff5a36"/></g>
        <circle cx="172" cy="172" r="10" fill="#ffd21f" stroke="#111" stroke-width="3"/>
      </svg>
      <div id="glassShine"></div>
    </div>
    <!-- patitas -->
    <div style="position:absolute;left:50px;bottom:-14px;width:46px;height:18px;border-radius:0 0 10px 10px;background:#8f6700"></div>
    <div style="position:absolute;right:50px;bottom:-14px;width:46px;height:18px;border-radius:0 0 10px 10px;background:#8f6700"></div>
  </div>

  <div id="titleWrap"><div id="title">Hasta la próxima</div></div>

 </div>
</div>

<script>
(() => {
  const q = new URLSearchParams(location.search);
  const PLAYLIST = q.get('playlist') || 'PLDmnfsm4Fai8';
  const VIDEO = q.get('video') || '';
  const TITULO = q.get('titulo') || 'Hasta la próxima';
  const DEMO = !!q.get('demo');
  const MUTE = q.get('mute') === '1';
  const DEBUG = !!q.get('debug');
  const ALEATORIO = q.get('aleatorio') === '1';
  const DESDE = parseFloat(q.get('desde') || '0');
  const HORA = q.get('hora');     // prueba: ?hora=10:08 o 10:08:30 (fija la hora del reloj)

  const $ = id => document.getElementById(id);
  const stage = $('stage'), world = $('world');

  // ----- Ajuste a la ventana (centrado; negro afuera de OBS) -----
  function fit() {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `translate(${(innerWidth - 1920 * s) / 2}px, ${(innerHeight - 1080 * s) / 2}px) scale(${s})`;
  }
  addEventListener('resize', fit); fit();
  if (window.obsstudio) { stage.style.background = 'transparent'; document.body.style.background = 'transparent'; }
  else { document.body.style.background = '#000'; }

  // ----- Título -----
  $('title').textContent = TITULO;
  const fitTitle = () => { const e = $('title'); e.style.fontSize = '120px'; const w = e.scrollWidth, max = 1180; if (w > max) e.style.fontSize = (120 * max / w) + 'px'; };
  fitTitle(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTitle);

  // ----- Marcas de las horas -----
  const ticks = $('ticks');
  for (let h = 0; h < 12; h++) {
    if (h % 3 === 0) continue;
    const a = h * Math.PI / 6, r1 = 142, r2 = 120;
    const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    l.setAttribute('x1', 172 + Math.sin(a) * r1); l.setAttribute('y1', 172 - Math.cos(a) * r1);
    l.setAttribute('x2', 172 + Math.sin(a) * r2); l.setAttribute('y2', 172 - Math.cos(a) * r2);
    ticks.appendChild(l);
  }

  // ----- Agujas con la hora real -----
  const hH = $('hHand'), mH = $('mHand'), sH = $('sHand');
  const fijo = HORA ? HORA.split(':').map(Number) : null;
  function tick() {
    let h, m, s;
    if (fijo) { h = fijo[0] || 0; m = fijo[1] || 0; s = fijo[2] || 0; }
    else { const d = new Date(); h = d.getHours(); m = d.getMinutes(); s = d.getSeconds() + d.getMilliseconds() / 1000; }
    const ms = m + s / 60;
    hH.setAttribute('transform', `rotate(${((h % 12) + ms / 60) * 30} 172 172)`);
    mH.setAttribute('transform', `rotate(${ms * 6} 172 172)`);
    sH.setAttribute('transform', `rotate(${s * 6} 172 172)`);
    if (!fijo) requestAnimationFrame(tick);
  }
  tick();

  // ----- Línea de tiempo -----
  const anims = [];
  const A = (el, kf, o) => { const a = el.animate(kf, Object.assign({ fill: 'both' }, o)); anims.push(a); return a; };
  const T_DROP = 500, T_BLANKET = 1900, T_DIM = 2800, T_TITLE = 3600, T_CLOCK = 800;

  // Cae a la cama con rebote
  A($('capy'), [
    { transform: 'translateY(-1100px) rotate(-4deg)', easing: 'cubic-bezier(.5,0,1,.6)' },
    { offset: .5, transform: 'translateY(0) rotate(0deg)', easing: 'cubic-bezier(0,.4,.5,1)' },
    { offset: .7, transform: 'translateY(-50px)', easing: 'cubic-bezier(.5,0,1,.6)' },
    { offset: .88, transform: 'translateY(0)' },
    { transform: 'translateY(0)' }
  ], { delay: T_DROP, duration: 1000 });

  // La manta lo tapa
  A($('blanket'), [
    { transform: 'translateY(-90px) scale(1,.9)', opacity: 0 },
    { offset: .35, opacity: 1 },
    { transform: 'translateY(0) scale(1,1)', opacity: 1 }
  ], { delay: T_BLANKET, duration: 900, easing: 'cubic-bezier(.3,.7,.4,1)' });

  // Respiración lenta + cabeceo de sueño
  const BR = { delay: T_BLANKET + 400, duration: 4200, direction: 'alternate', iterations: Infinity, easing: 'ease-in-out' };
  A($('capyBreath'), [{ transform: 'scale(1,1)' }, { transform: 'scale(1.016,1.032)' }], BR);
  A($('blanketB'), [{ transform: 'translateY(0)' }, { transform: 'translateY(-7px)' }], Object.assign({}, BR, { delay: T_BLANKET + 1200 }));
  A($('capyHead'), [
    { transform: 'translateY(0) rotate(0deg)', offset: 0 },
    { transform: 'translateY(-4px) rotate(-.5deg)', offset: .22 },
    { transform: 'translateY(0) rotate(0deg)', offset: .45 },
    { transform: 'translateY(4px) rotate(2.4deg)', offset: .62 },
    { transform: 'translateY(2px) rotate(1.4deg)', offset: .8 },
    { transform: 'translateY(0) rotate(-1.4deg)', offset: .88 },
    { transform: 'translateY(0) rotate(0deg)', offset: .93 },
    { transform: 'translateY(0) rotate(0deg)', offset: 1 }
  ], { delay: T_BLANKET + 700, duration: 9600, iterations: Infinity, easing: 'ease-in-out' });

  // Globito: se infla al soltar el aire y se achica al tomarlo
  A($('bubble'), [{ transform: 'scale(.12)', opacity: 0 }, { offset: .12, opacity: 1 }, { transform: 'scale(1)', opacity: 1 }],
    { delay: T_BLANKET + 1500, duration: 4200, direction: 'alternate', iterations: Infinity, easing: 'ease-in-out' });

  // Rayo de luna con polvito
  A($('shaft'), [{ opacity: 0 }, { opacity: 1 }], { delay: T_DIM + 600, duration: 1800, easing: 'ease-in-out' });
  A($('shaft'), [{ filter: 'brightness(1)' }, { filter: 'brightness(1.35)' }], { delay: T_DIM + 2400, duration: 5000, direction: 'alternate', iterations: Infinity, easing: 'ease-in-out' });

  // Se apaga la luz
  A($('dim'), [{ opacity: 0 }, { opacity: 1 }], { delay: T_DIM, duration: 1800, easing: 'ease-in-out' });
  A($('clockGlow'), [{ opacity: 0 }, { opacity: .45 }], { delay: T_DIM, duration: 1800, easing: 'ease-in-out' });

  // Zzz (se mecen al subir)
  ['z1', 'z2', 'z3', 'z4', 'z5'].forEach((id, i) => {
    A($(id), [
      { opacity: 0, transform: 'translate(0,0) scale(.5) rotate(-8deg)' },
      { offset: .15, opacity: 1 },
      { offset: .35, opacity: 1, transform: 'translate(30px,-50px) scale(.8) rotate(6deg)' },
      { offset: .65, opacity: .9, transform: 'translate(10px,-105px) scale(1.05) rotate(-6deg)' },
      { opacity: 0, transform: 'translate(44px,-165px) scale(1.25) rotate(8deg)' }
    ], { delay: T_BLANKET + 900 + i * 1100, duration: 5600, iterations: Infinity, easing: 'ease-out' });
  });

  // Entra el video en el reloj
  A($('videoBox'), [{ opacity: 0 }, { opacity: 1 }], { delay: T_CLOCK, duration: 700 });

  // Título neón
  A($('title'), [
    { opacity: 0, transform: 'scale(.7)' },
    { offset: .3, opacity: 1, transform: 'scale(1.06)' },
    { offset: .4, opacity: .5 },
    { offset: .5, opacity: 1 },
    { offset: .6, opacity: .7 },
    { offset: .7, opacity: 1, transform: 'scale(1)' },
    { opacity: 1, transform: 'scale(1)' }
  ], { delay: T_TITLE, duration: 1100, easing: 'ease-out' });

  if (DESDE > 0) anims.forEach(a => { a.currentTime = DESDE; });
  window.seek = ms => { anims.forEach(a => { a.pause(); a.currentTime = ms; }); };

  // ----- Video (YouTube) -----
  if (DEMO) {
    $('demoVid').style.display = 'block';
  } else {
    let player = null, ready = false;
    const quitarCC = () => { if (q.get('cc') === '1' || !player) return; try { player.unloadModule('captions'); player.unloadModule('cc'); } catch (e) {} };
    const go = () => {
      if (!player) return;
      try {
        if (ALEATORIO && !VIDEO) {
          try { player.setShuffle(true); } catch (e) {}
          const lista = player.getPlaylist();
          if (lista && lista.length > 1) { player.playVideoAt(Math.floor(Math.random() * lista.length)); return; }
        }
        player.playVideo();
      } catch (e) {}
    };
    window.onYouTubeIframeAPIReady = () => {
      const vars = { autoplay: 0, controls: 0, modestbranding: 1, rel: 0, iv_load_policy: 3, disablekb: 1, playsinline: 1, fs: 0, loop: 1, cc_load_policy: 0 };
      const cfg = { width: 612, height: 344, playerVars: vars,
        events: {
          onReady: () => { ready = true; if (MUTE) player.mute(); quitarCC(); setTimeout(go, T_CLOCK); },
          onStateChange: e => { if (e.data === 1) quitarCC(); if (e.data === 0) { try { player.playVideoAt(0); } catch (x) {} } },
          onError: e => {
            if (DEBUG) { $('dbg').style.display = 'block'; $('dbg').textContent = 'Error de YouTube ' + e.data; }
            try { player.nextVideo(); } catch (x) {}
          }
        } };
      if (VIDEO) { cfg.videoId = VIDEO; vars.playlist = VIDEO; }
      else { vars.listType = 'playlist'; vars.list = PLAYLIST; }
      player = new YT.Player('yt', cfg);
    };
    const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
  }
})();
</script>
</body>
</html>
